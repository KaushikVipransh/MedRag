services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: medrag-dev
    working_dir: /app
    volumes:
      - .:/app
      - hf-cache:/root/.cache/huggingface
      - medrag-index:/var/medrag
    env_file:
      - path: .env
        required: false
    environment:
      MEDRAG_CHROMA_DIR: /var/medrag/chroma
    ports:
      - "8501:8501"

volumes:
  hf-cache:
  medrag-index:
